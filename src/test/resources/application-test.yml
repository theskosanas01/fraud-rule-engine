spring:
  application:
    name: fraud-rule-engine-service-test
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MYSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
    show-sql: false
  sql:
    init:
      mode: never
  liquibase:
    enabled: false

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus,info,env
  metrics:
    export:
      prometheus:
        enabled: false

logging:
  level:
    root: WARN
    com.fraud.engine: INFO

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: false